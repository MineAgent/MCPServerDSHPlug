# Copyright (C) 2026 MineAgent
#
# 这个 bundle 只声明一件事：MC 模式（agent preset `mc`）。
#
# 桥是一个独立的 MCP stdio 程序，来自 MCPServer 仓库
# （入口 bin/minecraft-mcp-bridge.mjs，自带依赖，可以脱离 DSH 单独跑）。
# 默认在 ~/Projects/mcp/server、~/mcp/server、~/MCPServer 里依次查找；
# 装在别处时用 MC_BRIDGE_BIN 指定入口文件。
# 它把 .minecraft/mods 里几个模组挂在 127.0.0.1:3420 的 HTTP 接口
# （/ctl 控制、/aif 只读状态、/op 容器操作、/bt Baritone、/ka Kill Aura）
# 暴露成工具：
#   mcp__minecraft__status / help / player / inventory / world / chat /
#   sounds / screenshot / cursor / control / op / baritone / killaura / request
#
# MCP 客户端挂在 preset 自己的 plugins 里，而不是宿主全局层：mcp-client 的
# 工具注册在挂载它的那个 scope 上，所以这 14 个工具只对选了 MC 模式的
# Agent 可见，其他模式（标准 / PTC / 极简 / 创造 / 用户自建）完全看不到。
#
# 这套部署里工具本来就由各个 preset 自己挂载，宿主全局层是空的；MC 模式的
# 工具面就等于下面这份 plugins 清单，不需要再用 tools.restrict() 去 deny 谁。
# 这也是个配置型 bundle：包内没有插件模块，只有一个 preset 声明。
#
# toolCallTimeoutMs 要盖过桥自己的超时（/op 的合成最长约 2 分钟，
# 含 type 的 /ctl 请求最长约 2 分钟），否则长命令会被宿主先掐断。
#
# 系统提示词用 persona 的 complete 模式：整段提示词就是下面 prefix 的文本，
# 宿主的基线提示词、工作目录、运行时上下文、工具引导都不会追加进来。
#
# 流程工具在宿主层都是 disabled 的（tools.goal / tool-todo / plan-mode /
# tool-ask-user），所以也要在这个 preset 里挂载。
- insert:
    - id: preset-mc
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: mc
        name: MC 模式
        description: 把 Minecraft 客户端交给 Agent：工具面只留游戏控制与观测，玩法由你在对话里说明。
        order: 5
        plugins:
          - id: mcp-minecraft
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              serverName: minecraft
              transport: stdio
              # spawn 不经过 shell，command 只能是单个可执行文件，
              # 所以 `/usr/bin/env node` 要拆成 command + 第一个参数。
              command: /usr/bin/env
              args:
                - node
                # MCPServer 的入口：优先 MC_BRIDGE_BIN，否则依次找
                # ~/Projects/mcp/server、~/mcp/server、~/MCPServer。
                - !!js >-
                    (() => {
                      const fs = process.getBuiltinModule('node:fs');
                      const path = process.getBuiltinModule('node:path');
                      const home = process.env.HOME ?? process.env.USERPROFILE ?? '';
                      const rel = 'bin/minecraft-mcp-bridge.mjs';
                      if (process.env.MC_BRIDGE_BIN) return process.env.MC_BRIDGE_BIN;
                      const candidates = [
                        path.join(home, 'Projects/mcp/server', rel),
                        path.join(home, 'mcp/server', rel),
                        path.join(home, 'MCPServer', rel)
                      ];
                      return candidates.find((file) => fs.existsSync(file)) ?? candidates[0];
                    })()
              toolCallTimeoutMs: 240000
              failOnStartupError: true
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              complete: true
              includeRuntimeContext: false
              prefix: |-
                你正在操控本机的 Minecraft（Java 版）客户端，用 mcp__minecraft__ 开头的工具观察世界、采取行动。

                节奏
                1. 一次做一个动作，做完立刻用 player 和 inventory 对账。
                2. 想知道刚才发生了什么，就读 chat 和 sounds：指令输出、Baritone 反馈、报错与关键声音都在那里。
                3. 定时输入配合 waitMs 使用，等它做完再读状态。
                4. 界面操作优先用 op：结果精确，并且直接返回。需要点鼠标时，先 screenshot 看清界面，再用 cursor 取坐标，最后用 control 的 `mouse goto <x> <y>` 定位。
                5. 寻路与自动采集用 baritone；Kill Aura 的开关与配置用 killaura。遇到没有专用工具的新 endpoint，先 help 看说明，再用 request 兜底。
                6. 服务异常时先跑 status 自检。

                任务
                - 多步任务用 todo_write 记录进度。
                - 跨轮次的长期目标用 create_goal 建立，get_goal 查看，update_goal 更新或结束。
                - 需要用户做选择时用 ask_user_question。
                - 动手实现方案前，用 exit_plan_mode 提交计划并等待确认。
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  # persona 的 complete 模式让整段提示词只有 prefix，这段 section 不会
                  # 出现在请求里；plan-mode 要求 section 非空，所以留一句行为约定。
                  section: |-
                    计划模式：先把方案想清楚，再用 exit_plan_mode 提交完整计划并等待确认。
                    计划写清目标、成功标准、要做哪些改动、怎么验证，以及有哪些假设。
                    确认之后再动手。
    # ── MC 模式+ ─────────────────────────────────────────────────────────────
    # 工具面 = 标准模式的全部插件 + MC 模式自己挂载的 mcp-client（14 个
    # mcp__minecraft__*）。所以下面这份 plugins 清单就是 standard.patch.yml 的
    # 完整副本，只多一行 mcp-minecraft，一行不少、一行不多。
    #
    # 系统提示词与标准模式逐字相同：persona 只给 prefix，不设 complete，
    # 因此宿主基线提示词、工作目录、运行时上下文、工具引导照常追加——与标准模式
    # 完全一致，不掺任何 MC 专属文字；游戏怎么用由各个工具自己的说明负责。
    #
    # 不设 suffix：当前 DSH 只注册 provider / model 两个提示词变量，没有 {{cwd}}；
    # 工作目录由 working-directory 服务作为运行时上下文提供。写 {{cwd}} 会让每次
    # 请求在提示词装配阶段直接报 unknown prompt variable。
    #
    # dsh-web-app 升级后 standard 的清单若有增减，这里要跟着同步（这份副本不会
    # 自动跟随）。
    #
    # 代价：preset 的子插件在 profile 加载时就挂载（不等到选中该模式），所以这一行
    # 会让 profile 里多出一个 mcp-client 和它拉起的第二个 minecraft-mcp-bridge
    # 进程。桥只做 stdio↔HTTP 代理、不占端口，多一个进程没有副作用；想回到只有
    # 一个桥，重启 DSH 进程。
    - id: preset-mc-plus
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: mc-plus
        name: MC 模式+
        description: 标准模式 + MC 模式：读写文件、跑命令、联网、派子 Agent，同时用 mcp__minecraft__* 观察和操控 Minecraft。
        order: 8
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are a coding agent powered by the {{model}} model.
          - id: mcp-minecraft
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              serverName: minecraft
              transport: stdio
              # 同 preset-mc：spawn 不经过 shell，`/usr/bin/env node` 拆成两个字段。
              command: /usr/bin/env
              args:
                - node
                # 同 preset-mc：优先 MC_BRIDGE_BIN，否则自动查找。
                - !!js >-
                    (() => {
                      const fs = process.getBuiltinModule('node:fs');
                      const path = process.getBuiltinModule('node:path');
                      const home = process.env.HOME ?? process.env.USERPROFILE ?? '';
                      const rel = 'bin/minecraft-mcp-bridge.mjs';
                      if (process.env.MC_BRIDGE_BIN) return process.env.MC_BRIDGE_BIN;
                      const candidates = [
                        path.join(home, 'Projects/mcp/server', rel),
                        path.join(home, 'mcp/server', rel),
                        path.join(home, 'MCPServer', rel)
                      ];
                      return candidates.find((file) => fs.existsSync(file)) ?? candidates[0];
                    })()
              toolCallTimeoutMs: 240000
              failOnStartupError: true
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until the user approves your plan through exit_plan_mode or switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: true
          - id: tool-plugin-market
            name: '@deepseek-ai/dsh-plugin-market/tools'
            disabled: true
